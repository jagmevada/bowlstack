; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Without this, an env-less command (`pio run -t upload`, the VS Code toolbar
; button) acts on EVERY declared environment in order -- it would flash the
; production image and then immediately overwrite it with the debug one.
;
; Set to the debug image because the project is in bring-up and the documented
; workflow is plotter validation. CHANGE THIS TO esp32dev BEFORE SHIPPING, or
; always pass -e esp32dev explicitly for production builds.
[platformio]
default_envs = esp32dev-debug
; Object cache shared across rebuilds, and it earns its keep specifically here.
;
; Editing src/ui/ recompiles three files and links: ~9 s. Editing lv_conf.h
; recompiles ALL of LVGL, because every one of its ~400 translation units
; includes it: ~60 s. That asymmetry is invisible from the outside -- both are
; "I changed one file" -- and it is the difference between iterating and
; waiting.
;
; The cache makes the second case cheap on the way BACK: flipping a font size
; to try it and then reverting reuses the objects instead of rebuilding them.
build_cache_dir = .pio/cache

; Settings shared by every environment -- INCLUDING the desktop simulator, which
; is not an ESP32 at all.
;
; That is why `board` and `framework` are NOT here. PlatformIO applies [env] to
; every environment unconditionally, and there is no way to unset an inherited
; value: giving the native build an empty board yields "BoardConfig: Board is
; not defined", and leaving it inherited yields "Unknown board ID 'esp32dev'".
; Both read as a broken board definition rather than as a default that simply
; does not apply to a PC. The ESP32 settings live in [esp32_base] below, which
; the firmware environments extend explicitly.
[env]
; BOWLSTACK_DEVICE_ID identifies the INSTALLATION, not the board -- a swapped
; ESP32 must keep reporting the same id. It must exist in the Supabase
; `devices` table or the server rejects the device with 23503; the default
; BWL-000 in include/version.h is deliberately left unregistered so a unit
; flashed without this flag fails loudly instead of writing to a real slot.
build_flags = -Wall -DBOWLSTACK_DEVICE_ID='"BWL-001"'
; src/bringup/ holds board bring-up harnesses, each with its own setup()/loop().
; Without this filter every environment would compile them alongside main.cpp
; and fail on duplicate symbols -- so the exclusion is what lets a bring-up
; sketch live in the repo at all instead of in a scratch project that rots.
; src/ui/ is shared with the desktop simulator and is pure LVGL. It is excluded
; here because the discrete ESP32 images have no display and do not link LVGL;
; the environments that want it opt in.
build_src_filter = +<*> -<bringup/> -<sim/> -<ui/>

; Everything that makes an environment an ESP32 image. Extended, not inherited,
; so a native target can exist in the same file.
[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
;  adafruit/Adafruit SHT31 Library@^2.2.2
;  paulstoffregen/OneWire @ ^2.3.6
;  milesburton/DallasTemperature @ ^3.9.0
  tzapu/WiFiManager
  pololu/VL53L0X@^1.3.1
  bblanchon/ArduinoJson@^7.0.0
;  paulvha/sps30@^1.4.17
;  densaugeo/base64@^1.0.0

; Production image. Serial-plotter streaming is compiled out entirely; boot
; enumeration and error logging remain for field diagnosis.
[env:esp32dev]
extends = esp32_base

; Bring-up image. Adds the serial-plotter test harness.
[env:esp32dev-debug]
extends = esp32_base
build_flags = ${env.build_flags} -DBOWLSTACK_DEBUG_PLOT=1

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-2 -- touch-UI hardware
; ---------------------------------------------------------------------------
; Settings shared by every image for that board. Nothing inherits this yet
; except the bring-up harness; the integrated firmware environment joins it
; once the sensor buses are wired.
;
; The board is NOT esp32dev. Beyond the obvious (different silicon), three of
; these lines are load-bearing and each fails in a way that does not point at
; its cause:
;
;   memory_type = qio_opi   ESP32-S3R8 carries 8 MB of OCTAL PSRAM. Built as
;                           plain qio the image boots fine and simply reports
;                           zero PSRAM, so the failure surfaces later as an
;                           allocation returning null.
;   flash_size = 16MB       the module is a W25Q128 (16 MB). Left at the
;                           board default of 8 MB, half the flash is
;                           unaddressable and a 16 MB partition table is
;                           rejected.
;   USB_CDC_ON_BOOT         GPIO43/44 are UART0. Routing the console over
;                           native USB instead is what frees them, and it is
;                           also the only console available once the board is
;                           inside an enclosure with just the Type-C port out.
[waveshare_s3]
; Stated explicitly now that [env] no longer carries them -- see the note there.
platform = espressif32
framework = arduino
monitor_speed = 115200
board = esp32-s3-devkitc-1
; The shared 921600 is a UART speed and it BREAKS this board. Flashing goes
; over native USB-Serial-JTAG, where the baud rate is a fiction -- USB runs at
; its own rate regardless -- but esptool still issues the change and the bridge
; does not survive it:
;
;     Chip is ESP32-S3 (revision v0.2)
;     Stub running...
;     Changing baud rate to 921600
;     A fatal error occurred: No serial data received.
;
; which reads as a cable or driver fault, when in fact the chip had already
; been identified and the stub was running. 115200 costs nothing here because
; the link is not actually running at 115200 either.
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -Wall
  -DBOWLSTACK_BOARD_WAVESHARE_S3=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
; How LVGL finds include/lv_conf.h. BOTH lines are required and the second one
; is the non-obvious half.
;
; PlatformIO puts include/ on the search path for the PROJECT's sources, but
; not for libraries it builds under .pio/libdeps. Without the explicit -I, the
; effect is quietly asymmetric: this project's translation units see lv_conf.h
; and compile against it, while LVGL's own compile with built-in defaults. It
; does not fail at compile time. It fails at LINK time, as undefined references
; to exactly the things lv_conf.h enabled --
;
;     undefined reference to `lv_font_montserrat_48'
;     undefined reference to `lv_log_register_print_cb'
;
; -- which reads as a missing library rather than a config that never arrived.
;
; LV_CONF_PATH with an absolute path is the other documented route and is worse
; here: it is substituted into `#include LV_CONF_PATH` as a C string literal,
; and a Windows path puts backslashes inside it, where \U in \Users\ is an
; invalid escape sequence.
  -DLV_CONF_INCLUDE_SIMPLE
  -I "${platformio.include_dir}"

; Board bring-up only: panel, touch, LVGL binding, I2C buses, battery ADC.
; Links none of Bowlstack -- see the header of the source file for why the
; stages are separated the way they are.
[env:ws-s3-bringup]
extends = waveshare_s3
board = ${waveshare_s3.board}
board_build.arduino.memory_type = ${waveshare_s3.board_build.arduino.memory_type}
board_build.flash_mode = ${waveshare_s3.board_build.flash_mode}
board_upload.flash_size = ${waveshare_s3.board_upload.flash_size}
board_build.partitions = ${waveshare_s3.board_build.partitions}
upload_speed = ${waveshare_s3.upload_speed}
build_flags = ${waveshare_s3.build_flags}
; The harness plus the SHARED UI. Deliberately not ${env.build_src_filter} --
; this image is close to the inverse of the firmware ones.
;
; +<ui/> is what makes `pio run -e sim` evidence about this device: both images
; compile the same screens, the same gallery and the same demo scenarios, so
; they cannot show different things.
build_src_filter = -<*> +<bringup/> +<ui/>
; Overrides the shared list rather than extending it: WiFiManager, VL53L0X and
; ArduinoJson have no part in proving a screen works, and keeping them out
; means a compile error here is about the display.
lib_deps =
  lovyan03/LovyanGFX@^1.2.26
  lvgl/lvgl@^9.5.0

; ---------------------------------------------------------------------------
; Desktop preview -- the same UI, on this PC
; ---------------------------------------------------------------------------
; Compiles src/ui/ against the SAME include/lv_conf.h at the same 240x320 and
; colour depth, with SDL where LovyanGFX would be. Flashing the board is ~6
; minutes; this is about two seconds, which is the difference between iterating
; on a layout and avoiding it.
;
;     pio run -e sim -t exec
;
; It is a preview, not an emulator. Layout, wording, typography sizing and
; state logic transfer exactly. Colour, tearing, touch accuracy and legibility
; at ~200 DPI do NOT -- this monitor is ~96 DPI, so a font that looks smooth
; here proves nothing about the panel. Settle those on hardware.
;
; Needs the MSYS2 mingw64 toolchain; scripts/sim_toolchain.py puts it on PATH
; and prints the install commands if it is missing.
[env:sim]
platform = native
; No board, no framework -- see the note in [env]. Those live in [esp32_base]
; precisely so this environment can omit them rather than fight an inherited
; value it cannot unset.
extra_scripts = pre:scripts/sim_toolchain.py
build_src_filter = -<*> +<ui/> +<sim/>
build_flags =
  -std=gnu++17
  -DLV_CONF_INCLUDE_SIMPLE
  -I "${platformio.include_dir}"
; Pulls in LVGL's built-in SDL display/mouse/keyboard driver, so there is no
; separate porting layer to keep in step with the firmware one.
  -DLV_USE_SDL=1
; SDL2main wants to rename main() to WinMain on Windows. SDL_MAIN_HANDLED opts
; out, so sim_main.cpp keeps an ordinary main() and links only -lSDL2.
  -DSDL_MAIN_HANDLED
  -I C:/msys64/mingw64/include
  -L C:/msys64/mingw64/lib
  -lSDL2
lib_deps = lvgl/lvgl@^9.5.0
