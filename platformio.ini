; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Without this, an env-less command (`pio run -t upload`, the VS Code toolbar
; button) acts on EVERY declared environment in order -- it would flash the
; production image and then immediately overwrite it with the debug one.
;
; Set to the debug image because the project is in bring-up and the documented
; workflow is plotter validation. CHANGE THIS TO esp32dev BEFORE SHIPPING, or
; always pass -e esp32dev explicitly for production builds.
[platformio]
default_envs = esp32dev-debug

; Settings shared by every environment. Build the DEBUG env for bring-up and
; plotter work; build the plain env for anything shipped.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; BOWLSTACK_DEVICE_ID identifies the INSTALLATION, not the board -- a swapped
; ESP32 must keep reporting the same id. It must exist in the Supabase
; `devices` table or the server rejects the device with 23503; the default
; BWL-000 in include/version.h is deliberately left unregistered so a unit
; flashed without this flag fails loudly instead of writing to a real slot.
build_flags = -Wall -DBOWLSTACK_DEVICE_ID='"BWL-001"'
; src/fleet/ holds the fleet-simulator image and its own setup()/loop(). Excluded
; by default so it never collides with src/main.cpp; the esp32dev-fleet env swaps
; the two.
build_src_filter = +<*> -<fleet/>
lib_deps =
;  adafruit/Adafruit SHT31 Library@^2.2.2
;  paulstoffregen/OneWire @ ^2.3.6
;  milesburton/DallasTemperature @ ^3.9.0
  tzapu/WiFiManager
  pololu/VL53L0X@^1.3.1
  bblanchon/ArduinoJson@^7.0.0
;  paulvha/sps30@^1.4.17
;  densaugeo/base64@^1.0.0

; Production image. Serial-plotter streaming is compiled out entirely; boot
; enumeration and error logging remain for field diagnosis.
[env:esp32dev]

; Bring-up image. Adds the serial-plotter test harness.
[env:esp32dev-debug]
build_flags = ${env.build_flags} -DBOWLSTACK_DEBUG_PLOT=1

; Fleet simulator, for a BARE ESP32 with nothing wired to it. Presents itself to
; Supabase as up to 31 installations so the front-end has a fully populated
; database -- including the states one healthy prototype cannot produce.
;
; Only the sensor layer is dummy. net.cpp and telemetry.cpp are the SAME files
; the production image builds, so if the fleet works here it works in the field.
;
; BOWLSTACK_FLEET_SIM   how many nodes. Default 23 = BWL-002..BWL-024.
;
;   23 is not arbitrary. assign_devices.sql deploys BWL-001..BWL-024 across the 15
;   dish positions, and the prototype holds BWL-001, so 23 simulated nodes cover
;   exactly the rest of the deployed fleet. It also exceeds the 15 scenarios, so
;   every front-end case has a node.
;
;   BWL-025..BWL-032 stay silent, which is what makes `awaiting_deployment`
;   testable: it means "registered, never heard from", so a node reporting from a
;   reserved id would destroy the very state the front-end must distinguish from
;   `offline`. Do not raise this past 23 without deploying more devices first.
;
;   Lowering it is safe but drops scenarios from the top of the list, and
;   fleet_sim::begin() warns on the serial console when that happens.
;
; BOWLSTACK_FLEET_FIRST first id; 2 leaves BWL-001 to the real prototype.
; TELEMETRY_QUEUE_LEN   shrunk from 32, because there is one buffer PER NODE and
;                       the exercise is the wire interface, not buffer depth.
;
; main.cpp and tasks.cpp are excluded: the FreeRTOS fabric exists to keep
; measurement off the network path, and there is no measurement here.
[env:esp32dev-fleet]
build_src_filter = +<*> -<main.cpp> -<tasks.cpp> +<fleet/>
build_flags =
  -Wall
  -DBOWLSTACK_DEVICE_ID='"BWL-001"'
  -DBOWLSTACK_FLEET_SIM=23
  -DBOWLSTACK_FLEET_FIRST=2
  -DBOWLSTACK_TELEMETRY_QUEUE_LEN=8
