; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Without this, an env-less command (`pio run -t upload`, the VS Code toolbar
; button) acts on EVERY declared environment in order -- it would flash the
; production image and then immediately overwrite it with the debug one.
;
; Set to the debug image because the project is in bring-up and the documented
; workflow is plotter validation. CHANGE THIS TO esp32dev BEFORE SHIPPING, or
; always pass -e esp32dev explicitly for production builds.
[platformio]
default_envs = esp32dev-debug
; Object cache shared across rebuilds, and it earns its keep specifically here.
;
; Editing src/ui/ recompiles three files and links: ~9 s. Editing lv_conf.h
; recompiles ALL of LVGL, because every one of its ~400 translation units
; includes it: ~60 s. That asymmetry is invisible from the outside -- both are
; "I changed one file" -- and it is the difference between iterating and
; waiting.
;
; The cache makes the second case cheap on the way BACK: flipping a font size
; to try it and then reverting reuses the objects instead of rebuilding them.
build_cache_dir = .pio/cache

; Settings shared by every environment -- INCLUDING the desktop simulator, which
; is not an ESP32 at all.
;
; That is why `board` and `framework` are NOT here. PlatformIO applies [env] to
; every environment unconditionally, and there is no way to unset an inherited
; value: giving the native build an empty board yields "BoardConfig: Board is
; not defined", and leaving it inherited yields "Unknown board ID 'esp32dev'".
; Both read as a broken board definition rather than as a default that simply
; does not apply to a PC. The ESP32 settings live in [esp32_base] below, which
; the firmware environments extend explicitly.
[env]
; THE DEVICE ID IS NOT HERE ANY MORE. It used to be, and every image inherited
; it -- so this branch, which is a different product with its own LDC- series,
; had to override it and every translation unit compiled with a "redefined"
; warning. A default that has to be overridden by most of its users is not a
; default. It lives in [esp32_base] now, with the discrete product it names.
build_flags = -Wall
; THIS LIST IS A DENY-LIST BEHIND A `+<*>`, so anything added under src/ joins
; the DISCRETE images by default and has to be excluded by hand. That default is
; the wrong way round and it has now bitten twice; the entries below are each a
; specific failure rather than housekeeping.
;
; src/bringup/    board bring-up harnesses, each with its own setup()/loop().
;                 Compiled alongside main.cpp they fail on duplicate symbols --
;                 so the exclusion is what lets a bring-up sketch live in the
;                 repo at all instead of in a scratch project that rots.
;
; src/loadcell/   the same, for this branch's station firmware. It ALSO reaches
;                 for lvgl.h and LovyanGFX.hpp, which the discrete environments
;                 do not carry, so the duplicate-symbol error never even gets a
;                 chance to happen -- the build dies earlier, at the include,
;                 pointing at a "missing library" that is not missing and was
;                 never wanted here.
;
; nau7802.cpp     the three measurement files. They sit in src/ rather than in
; scale.cpp       src/loadcell/ because they are drivers rather than a sketch,
; i2cmux.cpp      which put them straight in the path of the `+<*>`. All three
;                 talk to the hardware through lgfx::i2c -- see nau7802.h for
;                 why that rather than TwoWire -- so all three need LovyanGFX
;                 and none belongs in an image with no display.
;
; src/ui/         shared with the desktop simulator and pure LVGL. Excluded here
;                 because the discrete ESP32 images have no display and do not
;                 link LVGL; the environments that want it opt in.
;
; src/fleet/      the fleet simulator, arriving with the feature/loadshell merge
;                 and carrying its own setup()/loop(). It is the FIRST entry here
;                 that was written on the other branch, where this exclusion sat
;                 in [esp32_base] because that branch had no [env] deny-list to
;                 put it in. Same rule, same reason as src/bringup/ above:
;                 compiled alongside main.cpp it is a duplicate-symbol error.
;
; The environments that DO want this code (ws-s3-loadcell, sim, esp32dev-fleet)
; replace this filter wholesale with their own list, which is why none of them
; is affected.
build_src_filter = +<*> -<bringup/> -<loadcell/> -<sim/> -<ui/> -<nau7802.cpp> -<scale.cpp> -<i2cmux.cpp> -<fleet/>

; Everything that makes an environment an ESP32 image. Extended, not inherited,
; so a native target can exist in the same file.
[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; BOWLSTACK_DEVICE_ID identifies the INSTALLATION, not the board -- a swapped
; ESP32 must keep reporting the same id. It must exist in the Supabase `devices`
; table or the server rejects the device with 23503; the default BWL-000 in
; include/version.h is deliberately left unregistered so a unit flashed without
; this flag fails loudly instead of writing to a real slot.
;
; MERGE NOTE. feature/loadshell set this as a literal `-Wall -DBOWLSTACK_...`
; and carried its own `build_src_filter = +<*> -<fleet/>` here. Both were
; correct on that branch, where [env] still held platform/board/framework and
; there was no [esp32_base]. Under this structure the flags compose from
; ${env.build_flags} instead, and the fleet exclusion belongs in [env]'s
; deny-list with the other four -- see there.
build_flags = ${env.build_flags} -DBOWLSTACK_DEVICE_ID='"BWL-001"'
lib_deps =
;  adafruit/Adafruit SHT31 Library@^2.2.2
;  paulstoffregen/OneWire @ ^2.3.6
;  milesburton/DallasTemperature @ ^3.9.0
  tzapu/WiFiManager
  pololu/VL53L0X@^1.3.1
  bblanchon/ArduinoJson@^7.0.0
;  paulvha/sps30@^1.4.17
;  densaugeo/base64@^1.0.0

; Production image. Serial-plotter streaming is compiled out entirely; boot
; enumeration and error logging remain for field diagnosis.
[env:esp32dev]
extends = esp32_base

; Bring-up image. Adds the serial-plotter test harness.
[env:esp32dev-debug]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DBOWLSTACK_DEBUG_PLOT=1

; Fleet simulator, for a BARE ESP32 with nothing wired to it. Presents itself to
; Supabase as up to 31 installations so the front-end has a fully populated
; database -- including the states one healthy prototype cannot produce.
;
; Only the sensor layer is dummy. net.cpp and telemetry.cpp are the SAME files
; the production image builds, so if the fleet works here it works in the field.
;
; BOWLSTACK_FLEET_SIM   how many nodes. Default 23 = BWL-002..BWL-024.
;
;   23 is not arbitrary. assign_devices.sql deploys BWL-001..BWL-024 across the 15
;   dish positions, and the prototype holds BWL-001, so 23 simulated nodes cover
;   exactly the rest of the deployed fleet. It also exceeds the 15 scenarios, so
;   every front-end case has a node.
;
;   BWL-025..BWL-032 stay silent, which is what makes `awaiting_deployment`
;   testable: it means "registered, never heard from", so a node reporting from a
;   reserved id would destroy the very state the front-end must distinguish from
;   `offline`. Do not raise this past 23 without deploying more devices first.
;
;   Lowering it is safe but drops scenarios from the top of the list, and
;   fleet_sim::begin() warns on the serial console when that happens.
;
; BOWLSTACK_FLEET_FIRST first id; 2 leaves BWL-001 to the real prototype.
; TELEMETRY_QUEUE_LEN   shrunk from 32, because there is one buffer PER NODE and
;                       the exercise is the wire interface, not buffer depth.
;
; main.cpp and tasks.cpp are excluded: the FreeRTOS fabric exists to keep
; measurement off the network path, and there is no measurement here.
;
; TWO THINGS CHANGED IN THE MERGE, and both are structural rather than about the
; simulator. `extends = esp32_base` is now required -- this env carried no
; `extends` on feature/loadshell because [env] held platform/board/framework
; there, and without it here PlatformIO reports "Board is not defined". And the
; filter has to repeat [env]'s whole deny-list: it REPLACES that list rather
; than extending it, so an unqualified `+<*>` would pull src/ui/ and the
; converter drivers into an image that links no LVGL.
[env:esp32dev-fleet]
extends = esp32_base
build_src_filter =
  +<*>
  -<main.cpp>
  -<tasks.cpp>
  -<bringup/>
  -<loadcell/>
  -<sim/>
  -<ui/>
  -<nau7802.cpp>
  -<scale.cpp>
  -<i2cmux.cpp>
  +<fleet/>
build_flags =
  ${env.build_flags}
  -DBOWLSTACK_DEVICE_ID='"BWL-001"'
  -DBOWLSTACK_FLEET_SIM=23
  -DBOWLSTACK_FLEET_FIRST=2
  -DBOWLSTACK_TELEMETRY_QUEUE_LEN=8

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-2 -- touch-UI hardware
; ---------------------------------------------------------------------------
; Settings shared by every image for that board. On this branch that is the
; load-cell station below, and nothing else.
;
; The board is NOT esp32dev. Beyond the obvious (different silicon), three of
; these lines are load-bearing and each fails in a way that does not point at
; its cause:
;
;   memory_type = qio_opi   ESP32-S3R8 carries 8 MB of OCTAL PSRAM. Built as
;                           plain qio the image boots fine and simply reports
;                           zero PSRAM, so the failure surfaces later as an
;                           allocation returning null.
;   flash_size = 16MB       the module is a W25Q128 (16 MB). Left at the
;                           board default of 8 MB, half the flash is
;                           unaddressable and a 16 MB partition table is
;                           rejected.
;   USB_CDC_ON_BOOT         GPIO43/44 are UART0. Routing the console over
;                           native USB instead is what frees them, and it is
;                           also the only console available once the board is
;                           inside an enclosure with just the Type-C port out.
[waveshare_s3]
; Stated explicitly now that [env] no longer carries them -- see the note there.
platform = espressif32
framework = arduino
monitor_speed = 115200
board = esp32-s3-devkitc-1
; The shared 921600 is a UART speed and it BREAKS this board. Flashing goes
; over native USB-Serial-JTAG, where the baud rate is a fiction -- USB runs at
; its own rate regardless -- but esptool still issues the change and the bridge
; does not survive it:
;
;     Chip is ESP32-S3 (revision v0.2)
;     Stub running...
;     Changing baud rate to 921600
;     A fatal error occurred: No serial data received.
;
; which reads as a cable or driver fault, when in fact the chip had already
; been identified and the stub was running. 115200 costs nothing here because
; the link is not actually running at 115200 either.
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; ${env.build_flags} FIRST, or this list REPLACES it rather than extending it
; and -DBOWLSTACK_DEVICE_ID goes with it. version.h then falls back to BWL-000 --
; the id platformio.ini itself describes as "deliberately left unregistered so a
; unit flashed without this flag fails loudly". Every S3 image built so far
; reported BWL-000 and built its setup AP as Bowlstack-BWL-000.
build_flags =
  ${env.build_flags} 
  -DBOWLSTACK_BOARD_WAVESHARE_S3=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
; How LVGL finds include/lv_conf.h. BOTH lines are required and the second one
; is the non-obvious half.
;
; PlatformIO puts include/ on the search path for the PROJECT's sources, but
; not for libraries it builds under .pio/libdeps. Without the explicit -I, the
; effect is quietly asymmetric: this project's translation units see lv_conf.h
; and compile against it, while LVGL's own compile with built-in defaults. It
; does not fail at compile time. It fails at LINK time, as undefined references
; to exactly the things lv_conf.h enabled --
;
;     undefined reference to `lv_font_montserrat_48'
;     undefined reference to `lv_log_register_print_cb'
;
; -- which reads as a missing library rather than a config that never arrived.
;
; LV_CONF_PATH with an absolute path is the other documented route and is worse
; here: it is substituted into `#include LV_CONF_PATH` as a C string literal,
; and a Windows path puts backslashes inside it, where \U in \Users\ is an
; invalid escape sequence.
  -DLV_CONF_INCLUDE_SIMPLE
  -I "${platformio.include_dir}"
; 96 KB rather than the 64 KB default. The menu tree took the pool from 37k to
; 46k of 58k -- 79% full -- and the whole point of that tree is that it grows.
; The preview's 93%-full pool is what produced the hangs it was reported with,
; and there is no reason to walk toward the same cliff here. ~169 KB of internal
; heap remains free with WiFi up, so this is affordable; revisit if TLS makes it
; tight.
  -DLV_MEM_SIZE=98304

; THE ToF BRING-UP HARNESS IS NOT ON THIS BRANCH.
;
; `ws-s3-bringup` built the Waveshare board against four VL53L0X and the bowl
; count. It cannot coexist with this branch's UI: the scope page is a TWO
; channel instrument here, wired to the load cells, and a four-trace ToF page
; drawing two of its four sensors would be a screen that lies about the
; hardware -- which is the one thing this codebase refuses everywhere.
;
; It is intact on `touch-ui`, along with src/bringup/bringup_display.cpp and
; bringup_sensors.cpp, which were removed here rather than left half-compiling.
; bringup_wifi.cpp and bringup_time.cpp stay: the load-cell image links both.
;
; The DISCRETE ToF product (`esp32dev`, `esp32dev-debug`, above) is untouched
; and still builds -- it has no display and links none of this.

; ---------------------------------------------------------------------------
; Load-cell station -- the shipping image on this branch
; ---------------------------------------------------------------------------
; Same board, same UI, a different measurement: two NAU7802 under one platform
; instead of four VL53L0X up a pipe.
;
;     pio run -e ws-s3-loadcell -t upload --upload-port COM6
;
; It links no ToF code at all: sensor_array, bowl_logic and main.cpp belong to
; the discrete product and carry their own setup()/loop(), which is exactly the
; duplicate symbol build_src_filter exists to prevent.
[env:ws-s3-loadcell]
extends = waveshare_s3
; Timestamps every console line. Added while chasing a boot that took 20-30 s,
; where the whole question was WHICH phase was spending it -- and the boot log
; prints the phases in order but says nothing about how long each took, so the
; answer was unobtainable from the output the firmware already produced. Kept
; because that question recurs on a bring-up branch and this costs nothing.
monitor_filters = time
board = ${waveshare_s3.board}
board_build.arduino.memory_type = ${waveshare_s3.board_build.arduino.memory_type}
board_build.flash_mode = ${waveshare_s3.board_build.flash_mode}
board_upload.flash_size = ${waveshare_s3.board_upload.flash_size}
board_build.partitions = ${waveshare_s3.board_build.partitions}
upload_speed = ${waveshare_s3.upload_speed}
build_flags =
  ${waveshare_s3.build_flags}
; Millivolts at the CELL per millivolt the ADC REPORTS, and it MUST be set here.
;
; config.h's #ifndef default is 1.9724f, which is a single-point calibration of
; ONE DISCRETE board -- its 10k/10k divider and that chip's ADC gain error folded
; into one measured number. It is not board-branched, so without this line the
; Waveshare 200k/100k divider is scaled by the wrong product's constant.
;
; THE FAILURE IS 4 mV WIDE AND LOOKS LIKE DEAD HARDWARE. A full 4100 mV cell
; presents 1366.7 mV at the pin; x1.9724 gives 2696 mV, which is just under
; config::BATTERY_PRESENT_ABOVE_MV (2700). battery::Monitor therefore never
; latches the cell as present, so the status bar draws the red "no cell" outline
; and the battery page says "no cell" with a full battery fitted. Nothing errors.
; It reads as a broken divider or a dead ADC rather than as a wrong constant --
; and being 4 mV from working, a unit whose ADC reads a percent high would do it
; intermittently across the fleet.
;
; 3.0 is the NOMINAL ratio (200k + 100k) / 100k, and it is the starting point
; rather than the answer. board_waveshare_s3.h section 4 explains why per-unit
; calibration matters MORE on this board than on the discrete one: the divider's
; 66.7k source impedance is well outside the ~10k the SAR ADC wants, so the
; static error from input leakage differs per chip and does not average away.
;
; To calibrate one unit: read the "pin" figure from the battery console line,
; measure the cell with a multimeter, and set this to cell mV / pin mV.
  -DBOWLSTACK_BATTERY_CAL=3.0f
; The known mass the Scale > Calibrate row weighs against, in grams. A build
; constant rather than an on-screen number pad: calibration happens once per
; assembly, against a mass someone physically owns, and typing digits on a 2"
; panel to describe it is the wrong trade. Change it here to match the weight on
; your bench.
;
; DEFINED FOR THE SIMULATOR TOO, so the row's label reads the same in both.
  -DBOWLSTACK_CAL_MASS_G=175
; The reference mass the 200 kg BUFFER cell's console calibrate key ('g') weighs
; against, in grams -- the buffer's counterpart of the line above, and it does not
; touch the counter's. 1060 g is a BENCH value: a boxed 1 kg filament spool was what
; was to hand, and a ~1 kg mass on a 200 kg cell is a poor calibration (its mass is
; known to a few per cent, which is a few kg at 100 kg). Replace it with 20 kg or
; more when there is one, and recalibrate.
  -DBOWLSTACK_BUF_CAL_MASS_G=1060
; Counts per gram for the ASSEMBLY -- both cells summed -- and it is a
; MEASUREMENT rather than a datasheet figure.
;
;     empty          110,000 counts  (+/- 100)
;     with 175 g     128,700 counts  (+/- 200)
;     -------------------------------------------
;      18,700 counts / 175 g  =  106.857 counts/g
;
; Taken on the bench with two YZC-133 cells under one platform. It is the
; DEFAULT, not a constant: the first calibration run on any unit overwrites it
; in NVS, and it exists so a freshly flashed board reads kilograms immediately
; instead of counts.
;
; IT AGREES WITH THE ARITHMETIC, which is the useful part -- a calibration that
; lands where the datasheet says it should is one you can trust to be measuring
; the right thing rather than one that happens to fit. A YZC-133 is 1.0 mV/V,
; the internal LDO excites it at 3.0 V, so 20 kg gives 3.0 mV. Full scale at
; gain 128 is +/-(3.0/2)/128 = +/-11.7 mV, so 20 kg on one cell is
; 8,388,608 x 3.0/11.7 = 2.15 M counts, i.e. 107.4 counts per gram. A load split
; between two cells produces that same figure on the SUM whatever the split,
; which is why one constant describes the assembly. Measured 106.857 against a
; predicted 107.4 is agreement to half a per cent.
;
; RESOLUTION. +/-200 counts of noise is +/-1.9 g raw, which the moving average
; below cuts by the square root of its length.
;
; RANGE. A signed 24-bit conversion at this sensitivity reaches ~78 kg on a
; single cell, so the ADC is NOT the limit here -- the cell's own 20 kg rating
; is, and it arrives first by a factor of four. The over-range flag in the
; firmware stays as a backstop rather than as something normal use will meet.
  -DBOWLSTACK_COUNTS_PER_GRAM=106.857f
; Samples in the moving average before a reading reaches the screen. One of
; 8 / 16 / 32 / 64 / 128 -- see the table in include/scale.h for what each costs
; in settling time and buys in jitter. Noise falls with the SQUARE ROOT of this
; and latency rises LINEARLY, so the useful range runs out quickly at the top.
;
; Sweep it: flash, put the reference mass on, and watch the last digit against
; how long the number takes to settle after the mass lands.
  -DBOWLSTACK_AVG_WINDOW=8
; Decimal places the DASHBOARD reading carries: 1 or 2 -- 0.0 or 0.00 kg,
; every platform alike. Only the factory default; the panel's Settings > Precision row
; overrides it per unit and persists that in NVS.
;
; It is here rather than only in scale.h because the desktop preview cannot
; include scale.h, and the fixture that feeds the Precision row's hint has to
; agree with the firmware. Display only -- Diagnose keeps all three places.
  -DBOWLSTACK_DECIMALS=1
; Converter output rate: 10, 20, 40, 80 or 320 SPS. THE RATE IS THE FILTER --
; see the long note in src/nau7802.cpp. 10 SPS integrates eight times longer
; than 80 and, because the decimation filter nulls at every multiple of the
; output rate, rejects 50 and 60 Hz mains outright.
  -DBOWLSTACK_SPS=10
; THIS BRANCH IS A DIFFERENT PRODUCT FROM THE BOWL COUNTER, so it carries its
; own identity. Nothing above defines one any more -- see the note in [env] --
; so these are the only definition rather than an override of an inherited one.
;
; The version string is quoted twice on purpose: the OUTER single quotes keep
; the space inside it together while platformio splits build_flags on
; whitespace, and the INNER double quotes are what make it a C string literal.
  -DBOWLSTACK_DEVICE_ID='"LDC-001"'
; NO AUTOMATIC TARE AT POWER-UP. The zero is taken only when somebody asks for
; it -- Settings > Scale > Tare, which lands back on the weight page so the
; total confirms it took.
;
; It was on, and it was the wrong default for a station that gets unplugged and
; carried. Auto-tare zeroes whatever is on the platform once the cells hold
; still, and it cannot tell an empty platform from a loaded one -- that is the
; whole difficulty, and AUTOTARE_DEADLINE_MS bounded the damage rather than
; preventing it. So any reset with a vessel in place silently redefined a full
; bowl as empty: a knocked plug, a brownout, a reflash, or a serial monitor
; asserting DTR/RTS. All four happened during this trial.
;
; The cost is that a unit boots reading "not tared" until an operator tares it,
; which is the honest state -- an untared scale does not know its zero, and this
; repo's rule is that it says so rather than assuming one.
  -DBOWLSTACK_AUTOTARE=0
; BUMPED FOR THE BOWL MAPPING, and the bump is the point rather than a
; formality. The knob page's 100% used to paint the vessel to its rim; it now
; paints the level the kitchen actually fills to (SERVING_FULL_VOL in
; ui_knob.cpp), so an attendant matching the same physical bowl dials ~1.14x
; what they dialled before. The stored byte is unchanged and so is every
; column, which is exactly the danger: the two calibration eras are
; indistinguishable in weight_samples unless something on the row differs.
; `firmware` is that something -- it is already on every history row
; (scale_telemetry.cpp:368), it just had to stop being equal.
  -DBOWLSTACK_FW_VERSION='"V1.21 261003"'
; The harness, the SHARED UI, and the two measurement files. bringup_wifi and
; bringup_time are pulled in BY NAME rather than by folder: the rest of
; src/bringup/ is the ToF harness and carries its own setup()/loop().
;
; +<ui/> is what makes `pio run -e sim` evidence about this device -- both
; images compile the same screens and the same fixtures, so they cannot show
; different things.
build_src_filter =
  -<*>
  +<loadcell/>
  +<ui/>
  +<nau7802.cpp>
  +<scale.cpp>
  +<i2cmux.cpp>
  +<bringup/bringup_wifi.cpp>
  +<bringup/bringup_time.cpp>
; THE FIRST FILE DELIBERATELY SHARED WITH THE DISCRETE IMAGES. uplink.cpp is the
; Supabase wire -- the TLS session, the URL normalisation and the SQLSTATE
; handling -- and it is pulled in here BY NAME while the discrete images get it
; through [env]'s `+<*>`. Two images, one implementation, which is the rule
; telemetry.h states and the reason this file is not simply copied into
; src/loadcell/.
;
; It is also why uplink.cpp must never name a radio: net.cpp is not linked here
; and bringup_wifi.cpp is not linked there, so the link check crosses as a
; function pointer. See include/uplink.h.
;
; scale_telemetry.cpp needs no entry -- `+<loadcell/>` already covers it.
  +<uplink.cpp>
; Overrides the shared list rather than extending it. VL53L0X has no part in
; weighing anything, and keeping it out means a compile error here is about the
; cells or the screen.
;
; ArduinoJson arrives with the uplink: this image linked no JSON at all until it
; had something to report.
lib_deps =
  lovyan03/LovyanGFX@^1.2.26
  lvgl/lvgl@^9.5.0
  bblanchon/ArduinoJson@^7.0.0

; ---------------------------------------------------------------------------
; Desktop preview -- the same UI, on this PC
; ---------------------------------------------------------------------------
; Compiles src/ui/ against the SAME include/lv_conf.h at the same 240x320 and
; colour depth, with SDL where LovyanGFX would be. Flashing the board is ~6
; minutes; this is about two seconds, which is the difference between iterating
; on a layout and avoiding it.
;
;     pio run -e sim -t exec
;
; It is a preview, not an emulator. Layout, wording, typography sizing and
; state logic transfer exactly. Colour, tearing, touch accuracy and legibility
; at ~200 DPI do NOT -- this monitor is ~96 DPI, so a font that looks smooth
; here proves nothing about the panel. Settle those on hardware.
;
; Needs the MSYS2 mingw64 toolchain; scripts/sim_toolchain.py puts it on PATH
; and prints the install commands if it is missing.
[env:sim]
platform = native
; No board, no framework -- see the note in [env]. Those live in [esp32_base]
; precisely so this environment can omit them rather than fight an inherited
; value it cannot unset.
extra_scripts = pre:scripts/sim_toolchain.py
build_src_filter = -<*> +<ui/> +<sim/>
build_flags =
  -std=gnu++17
  -DLV_CONF_INCLUDE_SIMPLE
  -I "${platformio.include_dir}"
; Same values as the device image, so the Scale > Calibrate row reads the same
; here as it will on the panel and the fixtures show the same units. A preview
; that labels a button differently from the product is a picture that resembles
; it.
  -DBOWLSTACK_CAL_MASS_G=175
  -DBOWLSTACK_COUNTS_PER_GRAM=106.857f
; Samples in the moving average before a reading reaches the screen. One of
; 8 / 16 / 32 / 64 / 128 -- see the table in include/scale.h for what each costs
; in settling time and buys in jitter. Noise falls with the SQUARE ROOT of this
; and latency rises LINEARLY, so the useful range runs out quickly at the top.
;
; Sweep it: flash, put the reference mass on, and watch the last digit against
; how long the number takes to settle after the mass lands.
  -DBOWLSTACK_AVG_WINDOW=8
; Decimal places the DASHBOARD reading carries: 1 or 2 -- 0.0 or 0.00 kg,
; every platform alike. Only the factory default; the panel's Settings > Precision row
; overrides it per unit and persists that in NVS.
;
; It is here rather than only in scale.h because the desktop preview cannot
; include scale.h, and the fixture that feeds the Precision row's hint has to
; agree with the firmware. Display only -- Diagnose keeps all three places.
  -DBOWLSTACK_DECIMALS=1
; Converter output rate: 10, 20, 40, 80 or 320 SPS. THE RATE IS THE FILTER --
; see the long note in src/nau7802.cpp. 10 SPS integrates eight times longer
; than 80 and, because the decimation filter nulls at every multiple of the
; output rate, rejects 50 and 60 Hz mains outright.
  -DBOWLSTACK_SPS=10
; THIS BRANCH IS A DIFFERENT PRODUCT FROM THE BOWL COUNTER, so it carries its
; own identity. Nothing above defines one any more -- see the note in [env] --
; so these are the only definition rather than an override of an inherited one.
;
; The version string is quoted twice on purpose: the OUTER single quotes keep
; the space inside it together while platformio splits build_flags on
; whitespace, and the INNER double quotes are what make it a C string literal.
  -DBOWLSTACK_DEVICE_ID='"LDC-001"'
  -DBOWLSTACK_FW_VERSION='"V1.21 261003"'
; Pulls in LVGL's built-in SDL display/mouse/keyboard driver, so there is no
; separate porting layer to keep in step with the firmware one.
  -DLV_USE_SDL=1
; A bigger LVGL pool for the PREVIEW ONLY. lv_sdl_window_create() takes its draw
; buffers from that pool, where the device allocates its own from DMA-capable
; SRAM -- measured, the preview sat at 51k of 55k used with 11% fragmentation,
; i.e. 93% full, which is where allocations begin failing intermittently and is
; the best explanation for it slowing and hanging after a while. The device
; keeps the smaller pool so its internal SRAM stays available for the WiFi and
; TLS stacks still to come.
  -DLV_MEM_SIZE=196608
; SDL2main wants to rename main() to WinMain on Windows. SDL_MAIN_HANDLED opts
; out, so sim_main.cpp keeps an ordinary main() and links only -lSDL2.
;
; THE TRAILING `=` IS LOAD-BEARING and is not a typo. LVGL's own
; lv_sdl_window.c defines SDL_MAIN_HANDLED as EMPTY; a bare -D would define it
; as 1, and the two spellings of the same switch produce a "redefined" warning
; on every build. SDL only ever tests it with #ifdef, so empty is equivalent.
  -DSDL_MAIN_HANDLED=
  -I C:/msys64/mingw64/include
  -L C:/msys64/mingw64/lib
  -lSDL2
lib_deps = lvgl/lvgl@^9.5.0
