# Publishes web/ to GitHub Pages.
#
# The Supabase URL and anon key are written into web/config.js at deploy time
# from repository secrets, so they are not in git history. Note that the built
# site is public if the repo's Pages site is public — the anon key ends up
# readable either way. It is designed for that (row-level security is what
# protects the data), but see the note in web/config.js before deciding.
#
# Leave the secrets unset and the app simply asks each browser for the
# connection on first run instead.
name: Deploy dashboard to Pages

on:
  push:
    # `frontend` is here so the trial can deploy without first merging a
    # dashboard into main. Drop it once this lands on main.
    branches: [main, frontend]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write web/config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Optional. Unset means silent anonymous sign-in, which needs
          # "Allow anonymous sign-ins" ON in the Supabase dashboard. Set both
          # to sign in silently as a real account instead.
          DASHBOARD_EMAIL: ${{ secrets.DASHBOARD_EMAIL }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "No SUPABASE_* secrets set — the app will ask each browser on first run."
            cp web/config.example.js web/config.js
            exit 0
          fi
          # json.dumps, not shell interpolation: a key or password containing a
          # quote would otherwise emit JavaScript that does not parse, and the
          # page would fail at load with nothing to point at.
          python3 - > web/config.js <<'PY'
          import json, os
          email, password = os.environ.get('DASHBOARD_EMAIL'), os.environ.get('DASHBOARD_PASSWORD')
          auto = {'email': email, 'password': password} if email and password else 'anonymous'
          print('// Generated by .github/workflows/pages.yml. Do not edit.')
          print('window.BOWLSTACK_CONFIG = ' + json.dumps({
              'url': os.environ['SUPABASE_URL'].rstrip('/'),
              'anonKey': os.environ['SUPABASE_ANON_KEY'],
              'autoLogin': auto,
          }, indent=2) + ';')
          PY
          if [ -n "$DASHBOARD_EMAIL" ]; then MODE=account; else MODE=anonymous; fi
          echo "Wrote web/config.js (auto-login: $MODE)"

      # enablement only helps once Pages already exists. Creating the site
      # needs admin rights GITHUB_TOKEN does not have, so on a repo where
      # Pages has never been turned on this step fails with the unhelpful
      # "Resource not accessible by integration". That is a ONE-TIME manual
      # step -- see web/README.md -- not something to debug here.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
